<!doctype html>
<html lang="en">
<head>
    <!-- include:head -->
    <title>{{siteTitle}}</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{siteTitle}}">
    <meta property="og:url" content="{{baseUrl}}">
    <meta property="og:site_name" content="{{siteTitle}}">
    <!-- if:bio --><meta name="description" content="{{bio}}"><meta property="og:description" content="{{bio}}"><!-- end:bio -->
    <!-- if:siteImage --><meta property="og:image" content="{{siteImage}}"><!-- end:siteImage -->
    <!-- if:siteImageLarge --><meta name="twitter:card" content="summary_large_image"><!-- end:siteImageLarge -->
</head>
<body class="page-list">
<!-- include:header -->
<main class="content list" data-page>
    <!-- if:cover --><div class="hero-cover"><img src="{{cover}}" alt=""></div><!-- end:cover -->
    <section class="profile<!-- if:!avatar --> no-avatar<!-- end:!avatar -->">
        <!-- if:avatar --><img class="profile-image" src="{{avatar}}" alt="{{siteTitle}}" width="72" height="72"><!-- end:avatar -->
        <div class="profile-text">
            <h1>{{siteTitle}}</h1>
            <!-- if:bio --><p class="bio">{{bio}}</p><!-- end:bio -->
            <p class="stats mono"><span>{{trackCount}} <!-- if:many -->tracks<!-- end:many --><!-- if:!many -->track<!-- end:!many --></span><!-- if:hasFollowers --><span>{{followerCount}} followers</span><!-- end:hasFollowers --></p>
        </div>
        <button class="button icon" type="button" data-share-site data-title="{{siteTitle}}" data-url="{{baseUrl}}" aria-label="Share this stage"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-share"/></svg></button>
    </section>
    <!-- if:hasLinks -->
    <nav class="links">
        <!-- each:links --><a href="{{linkUrl}}" target="_blank" rel="noopener me"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-{{linkIcon}}"/></svg>{{linkLabel}}<span class="arrow">↗</span></a><!-- end:links -->
    </nav>
    <!-- end:hasLinks -->
    <!-- if:hasFeatured -->
    <!-- each:featured -->
    <section class="featured" data-track data-uuid="{{uuid}}" data-src="{{mixdown}}" data-peaks="{{peaks}}" data-duration="{{seconds}}"
             data-title="{{title}}" data-artist="{{artist}}" data-cover="{{cover}}" data-url="{{url}}" data-share-url="{{absoluteUrl}}">
        <a class="cover" href="{{url}}"><img src="{{cover}}" alt="Cover of {{title}}" width="200" height="200"></a>
        <div class="body">
            <span class="mono label">Featured</span>
            <h2><a href="{{url}}">{{title}}</a></h2>
            <!-- if:hasDescription --><p class="description">{{shortDescription}}</p><!-- end:hasDescription -->
            <span class="mono">{{date}}<!-- if:bpm --> · {{bpm}} BPM<!-- end:bpm --></span>
            <div class="player-row">
                <button class="play" type="button" data-play aria-label="Play {{title}}"><!-- include:icons --></button>
                <div class="waveform" data-waveform><canvas></canvas></div>
                <span class="mono" data-position data-total="{{duration}}">{{duration}}</span>
            </div>
        </div>
    </section>
    <!-- end:featured -->
    <!-- end:hasFeatured -->
    <section class="tracks" id="tracks">
        <!-- if:empty --><p class="empty">No tracks yet.</p><!-- end:empty -->
        <!-- if:!empty -->
        <div class="tracks-head">
            <h2>Tracks</h2>
            <span class="mono" data-count data-total="{{trackCount}}">{{trackCount}}</span>
            <span class="spacer"></span>
            <!-- if:hasSort --><span class="filters"><button class="filter active" type="button" data-sort="new">Newest</button><button class="filter" type="button" data-sort="likes">Most liked</button></span><!-- end:hasSort -->
            <!-- if:hasSearch --><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-search"/></svg><input type="search" placeholder="Search" autocomplete="off" data-search aria-label="Search tracks"></label><!-- end:hasSearch -->
        </div>
        <!-- if:hasTagFilter -->
        <div class="filters tag-filter"><button class="filter active" type="button" data-tag-filter="">All</button><!-- each:filterTags --><button class="filter" type="button" data-tag-filter="{{filterTag}}">{{filterTag}}<sup>{{filterCount}}</sup></button><!-- end:filterTags --></div>
        <!-- end:hasTagFilter -->
        <div class="grid" data-grid>
            <!-- each:tracks -->
            <article class="card" data-track data-uuid="{{uuid}}" data-src="{{mixdown}}" data-peaks="{{peaks}}" data-duration="{{seconds}}"
                     data-title="{{title}}" data-artist="{{artist}}" data-cover="{{cover}}" data-url="{{url}}" data-share-url="{{absoluteUrl}}"
                     data-tags="{{tagList}}" data-bpm="{{bpm}}" data-created="{{created}}" data-likes="{{likes}}">
                <button class="cover" type="button" data-play aria-label="Play or pause {{title}}"><img src="{{cover}}" alt="" loading="lazy" width="240" height="240"><span class="play"><!-- include:icons --></span></button>
                <a class="title" href="{{url}}">{{title}}</a>
                <div class="waveform" data-waveform><canvas></canvas></div>
                <div class="row">
                    <span class="mono"><!-- if:bpm -->{{bpm}} BPM · <!-- end:bpm --><span data-position data-total="{{duration}}">{{duration}}</span></span>
                    <span class="spacer"></span>
                    <!-- if:google -->
                    <button class="count like<!-- if:liked --> active<!-- end:liked -->" type="button" data-like="{{uuid}}" data-login="{{loginUrl}}" aria-label="Like"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-heart"/></svg><span data-like-count>{{likes}}</span></button>
                    <!-- if:commentCount --><a class="count" href="{{url}}#comments" aria-label="Comments"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-comment"/></svg>{{commentCount}}</a><!-- end:commentCount -->
                    <!-- end:google -->
                    <button class="count" type="button" data-share aria-label="Share {{title}}"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-share"/></svg></button>
                </div>
            </article>
            <!-- end:tracks -->
        </div>
        <p class="empty hidden" data-no-results>Nothing found.</p>
        <!-- end:!empty -->
    </section>
</main>
<!-- include:footer -->
</body>
</html>
